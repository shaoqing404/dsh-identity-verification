name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test plugin/test/*.test.js scripts/test/native-auth-channel.test.mjs native/tests/runner.test.mjs native/tests/source-guard.test.mjs
      - run: git diff --check
